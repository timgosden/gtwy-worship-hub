<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Bank - Worship Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav id="site-nav"></nav>
<div class="drawer" id="drawer"></div>

<div class="page">
  <div class="page-inner">

    <div class="section-label">Resources</div>
    <h1 class="page-title">Song<span>Bank</span></h1>
    <div class="rule left"></div>
    <p class="page-desc">
      Our approved song list for Sunday gatherings.
    </p>

    <div class="section-block">

      <input
        class="form-input"
        id="song-search"
        type="search"
        placeholder="Search songs, themes, first lines or CCLI numbers…"
        style="margin-bottom:16px"
        oninput="filterSongs(this.value)"
      />

      <div id="song-list"><p class="song-loading">Loading…</p></div>

    </div>

  </div>
</div>

<footer>
  <a href="https://gatewayvineyard.church">GatewayVineyard.Church</a>
  <p>Worship Team Hub</p>
</footer>

<script src="nav.js"></script>
<script>
var SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQnrYlj8Sk1pBs5_D4ByZz7leBs_aM_40zE_g-Ih3eAYWqklRo3eVc9XuziiRCGGg/pub?gid=444275959&single=true&output=csv';

// Sheet columns: Song Title | First Line | CCLI | Songselect Link | Key | BPM |
// Introduce - Central | Introduce - Chapel. The header row is detected by its
// labels (and its first cell may double as the first section name, e.g.
// "Gathering - a call to worship").
var allSections = [];

// Quote-aware CSV parser - handles commas AND newlines inside quoted cells
function parseCSV(text) {
  var rows = [], row = [], cur = '', inQ = false;
  text = text.replace(/\r/g, '');
  for (var i = 0; i < text.length; i++) {
    var c = text[i];
    if (inQ) {
      if (c === '"' && text[i + 1] === '"') { cur += '"'; i++; }
      else if (c === '"') { inQ = false; }
      else { cur += c; }
    } else if (c === '"') { inQ = true; }
    else if (c === ',') { row.push(cur.trim()); cur = ''; }
    else if (c === '\n') { row.push(cur.trim()); rows.push(row); row = []; cur = ''; }
    else { cur += c; }
  }
  row.push(cur.trim());
  rows.push(row);
  return rows;
}

// Sheet columns: TITLE | Alt Title | CCLI Number | Link | BPM | Key | Tag 1 | Tag 2
var COLS = { title: 0, firstLine: 1, ccli: 2, link: 3, bpm: 4, key: 5, themes: 6, themes2: 7, central: -1, chapel: -1, notes: -1 };

// Returns the number of recognised header labels in the row
function detectColumns(row) {
  var found = {}, hits = 0;
  row.forEach(function(cell, i) {
    var h = (cell || '').toLowerCase();
    if (!h) return;
    if (h.indexOf('first') >= 0 || h.indexOf('alt') >= 0) { found.firstLine = i; hits++; }
    else if (h.indexOf('ccli') >= 0 && h.indexOf('link') < 0) { found.ccli = i; hits++; }
    else if (h.indexOf('songselect') >= 0 || h.indexOf('song select') >= 0 || h.indexOf('link') >= 0) { found.link = i; hits++; }
    else if (h === 'key' || h.indexOf('key') === 0) { found.key = i; hits++; }
    else if (h.indexOf('bpm') >= 0 || h.indexOf('tempo') >= 0) { found.bpm = i; hits++; }
    else if (h.indexOf('central') >= 0) { found.central = i; hits++; }
    else if (h.indexOf('chapel') >= 0) { found.chapel = i; hits++; }
    else if (h.indexOf('theme') >= 0 || h.indexOf('tag') >= 0) {
      if (found.themes === undefined) found.themes = i; else found.themes2 = i;
      hits++;
    }
    else if (h.indexOf('note') >= 0) { found.notes = i; hits++; }
    else if (h === 'song' || h === 'title' || h.indexOf('song title') >= 0) { found.title = i; hits++; }
  });
  if (hits >= 2) Object.keys(found).forEach(function(k) { COLS[k] = found[k]; });
  return hits;
}

function cell(row, idx) {
  return idx >= 0 ? (row[idx] || '') : '';
}

function buildSections(rows) {
  var sections = [];
  var current = null;
  var headerDone = false;

  rows.forEach(function(row) {
    var filled = row.filter(function(c) { return (c || '').trim(); }).length;
    var c0 = (row[0] || '').trim();

    if (!filled) return;
    if (c0.toUpperCase().indexOf('SONGBANK') >= 0 || c0.toUpperCase().indexOf('SONG BANK') >= 0) return;
    if (c0.toUpperCase().indexOf('MULTISITE') >= 0) return;

    // Header row: contains column labels like CCLI / BPM / Songselect Link.
    // Its first cell may also name the first section.
    if (!headerDone && detectColumns(row) >= 2) {
      headerDone = true;
      if (c0 && c0.toLowerCase().indexOf('title') < 0 && c0.toLowerCase() !== 'song') {
        current = { section: c0, songs: [] };
        sections.push(current);
      }
      return;
    }

    var title = cell(row, COLS.title).trim();
    if (!title) return;

    // Section header: only the title cell is filled
    if (filled === 1) {
      current = { section: title, songs: [] };
      sections.push(current);
      return;
    }

    if (!current) {
      current = { section: 'Songs', songs: [] };
      sections.push(current);
    }
    current.songs.push({
      title:     title,
      firstLine: cell(row, COLS.firstLine),
      ccli:      cell(row, COLS.ccli),
      link:      cell(row, COLS.link),
      key:       cell(row, COLS.key),
      bpm:       cell(row, COLS.bpm),
      central:   cell(row, COLS.central),
      chapel:    cell(row, COLS.chapel),
      themes:    cell(row, COLS.themes),
      themes2:   cell(row, COLS.themes2),
      notes:     cell(row, COLS.notes)
    });
  });

  return sections;
}

function sectionClass(name) {
  var s = name.toUpperCase();
  if (s.indexOf('GATHERING') >= 0 || s.indexOf('CALL TO WORSHIP') >= 0) return 'sc-gathering';
  if (s.indexOf('REVELATION') >= 0) return 'sc-revelation';
  if (s.indexOf('RESPONSE') >= 0 || s.indexOf('ENCOUNTER') >= 0 || s.indexOf('INTIMACY') >= 0) return 'sc-response';
  if (s.indexOf('VINEYARD') >= 0 || s.indexOf('HOMEGROWN') >= 0 || s.indexOf('GATEWAY') >= 0) return 'sc-homegrown';
  return '';
}

function themeBadge(themes) {
  if (!themes) return '';
  return '<span class="song-chip theme">' + esc(themes) + '</span>';
}

function keyBadge(key) {
  if (!key) return '';
  return '<span class="song-chip key">Key ' + esc(key) + '</span>';
}

function bpmBadge(bpm) {
  if (!bpm) return '';
  return '<span class="song-chip key">' + esc(bpm) + ' BPM</span>';
}

function notesBadge(notes) {
  if (!notes) return '';
  var lower = notes.toLowerCase();
  var cls = lower.indexOf('classic') >= 0 ? 'song-chip key' :
            lower.indexOf('homegrown') >= 0 ? 'song-chip homegrown' :
            lower.indexOf('vineyard') >= 0 || lower.indexOf('kxc') >= 0 ? 'song-chip vineyard' :
            'song-chip';
  return '<span class="' + cls + '">' + esc(notes) + '</span>';
}

function renderSections(sections) {
  var el = document.getElementById('song-list');
  var total = sections.reduce(function(n, s) { return n + s.songs.length; }, 0);

  if (!total) {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;font-style:italic">No songs found.</p>';
    return;
  }

  var html = '';
  sections.forEach(function(s) {
    if (!s.songs.length) return;
    var sc = sectionClass(s.section);
    html += '<p class="rota-month-heading' + (sc ? ' ' + sc : '') + '">' + esc(s.section) + '</p>';
    s.songs.forEach(function(song) {
      var ccliLink = /^https?:\/\//.test(song.link) ? song.link
                   : /^\d+$/.test(song.ccli) ? 'https://songselect.ccli.com/Songs/' + song.ccli : '';
      var titleEl = ccliLink
        ? '<a class="song-title" href="' + esc(ccliLink) + '" target="_blank" rel="noopener">' + esc(song.title) + '</a>'
        : '<span class="song-title">' + esc(song.title) + '</span>';

      html += '<div class="song-row' + (sc ? ' ' + sc : '') + '">'
        + '<div class="song-main">'
        + titleEl
        + (song.firstLine ? '<span class="song-first-line">' + esc(song.firstLine) + '</span>' : '')
        + '</div>'
        + '<div class="song-meta">'
        + keyBadge(song.key)
        + bpmBadge(song.bpm)
        + themeBadge(song.themes)
        + themeBadge(song.themes2)
        + notesBadge(song.notes)
        + '</div>'
        + '</div>';
    });
  });

  el.innerHTML = html;
}

function filterSongs(query) {
  var q = query.toLowerCase().trim();
  if (!q) { renderSections(allSections); return; }

  var filtered = allSections.map(function(s) {
    return {
      section: s.section,
      songs: s.songs.filter(function(song) {
        return (song.title + ' ' + song.firstLine + ' ' + song.ccli + ' ' + song.themes + ' ' + song.themes2 + ' ' + song.notes + ' ' + song.bpm + ' ' + song.key)
          .toLowerCase().indexOf(q) >= 0;
      })
    };
  });

  renderSections(filtered);
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

fetch(SHEET_URL)
  .then(function(r) { return r.text(); })
  .then(function(text) {
    var rows = parseCSV(text);
    allSections = buildSections(rows);
    renderSections(allSections);
  })
  .catch(function() {
    document.getElementById('song-list').innerHTML =
      '<p style="color:var(--muted);font-size:13px">Couldn\'t load the song list - please try again shortly.</p>';
  });
</script>
</body>
</html>
