<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Song Bank - Worship Hub</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:ital,wght@0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,300&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>

<nav id="site-nav"></nav>
<div class="drawer" id="drawer"></div>

<div class="page">
  <div class="page-inner">

    <div class="section-label">Resources</div>
    <h1 class="page-title">Song<span>Bank</span></h1>
    <div class="rule left"></div>
    <p class="page-desc">
      Our approved song list for Central and Chapel services.
    </p>

    <div class="section-block">

      <input
        class="form-input"
        id="song-search"
        type="search"
        placeholder="Search songs, themes, first lines or CCLI numbers…"
        style="margin-bottom:16px"
        oninput="filterSongs(this.value)"
      />

      <div id="song-list"><p class="song-loading">Loading…</p></div>

    </div>

  </div>
</div>

<footer>
  <a href="https://gatewayvineyard.church">GatewayVineyard.Church</a>
  <p>Worship Team Hub</p>
</footer>

<script src="nav.js"></script>
<script>
var SHEET_URL = 'https://docs.google.com/spreadsheets/d/e/2PACX-1vQnrYlj8Sk1pBs5_D4ByZz7leBs_aM_40zE_g-Ih3eAYWqklRo3eVc9XuziiRCGGg/pub?gid=444275959&single=true&output=csv';

// Columns are detected from the sheet's header row (Song Title, First Line,
// CCLI, Themes, Notes, BPM, SongSelect) and fall back to that order.
var allSections = [];

function parseCSV(text) {
  var lines = text.replace(/\r/g, '').split('\n');
  return lines.map(function(line) {
    var cells = [], cur = '', inQ = false;
    for (var i = 0; i < line.length; i++) {
      var c = line[i];
      if (c === '"') { inQ = !inQ; }
      else if (c === ',' && !inQ) { cells.push(cur.trim()); cur = ''; }
      else { cur += c; }
    }
    cells.push(cur.trim());
    return cells;
  });
}

// Default column order; overridden by the sheet's header row if present
var COLS = { title: 0, firstLine: 1, ccli: 2, themes: 3, notes: 4, bpm: 5, link: 6 };

function detectColumns(row) {
  var found = {};
  row.forEach(function(cell, i) {
    var h = (cell || '').toLowerCase();
    if (h.indexOf('title') >= 0 || h === 'song') found.title = i;
    else if (h.indexOf('first') >= 0) found.firstLine = i;
    else if (h.indexOf('ccli') >= 0 && h.indexOf('link') < 0) found.ccli = i;
    else if (h.indexOf('theme') >= 0) found.themes = i;
    else if (h.indexOf('note') >= 0) found.notes = i;
    else if (h.indexOf('bpm') >= 0 || h.indexOf('tempo') >= 0) found.bpm = i;
    else if (h.indexOf('songselect') >= 0 || h.indexOf('song select') >= 0 || h.indexOf('link') >= 0) found.link = i;
  });
  if (found.title !== undefined) {
    Object.keys(found).forEach(function(k) { COLS[k] = found[k]; });
    return true;
  }
  return false;
}

// Sections are rows with text in the title column only, everything else empty
function buildSections(rows) {
  var sections = [];
  var current = null;

  rows.forEach(function(row) {
    var filled = row.filter(function(c) { return (c || '').trim(); }).length;
    var c0 = row[0] || '';

    if (!filled) return;
    if (c0 === 'Song Title' || (c0.toLowerCase().indexOf('title') >= 0 && detectColumns(row))) return;
    if (c0.toUpperCase().indexOf('SONGBANK') >= 0 || c0.toUpperCase().indexOf('SONG BANK') >= 0) return;
    if (c0.toUpperCase().indexOf('MULTISITE') >= 0) return;

    var title = row[COLS.title] || '';
    if (!title) return;

    // Section header: only the title cell is filled
    if (filled === 1 && title) {
      current = { section: title, songs: [] };
      sections.push(current);
      return;
    }

    if (current) {
      current.songs.push({
        title:     title,
        firstLine: row[COLS.firstLine] || '',
        ccli:      row[COLS.ccli] || '',
        themes:    row[COLS.themes] || '',
        notes:     row[COLS.notes] || '',
        bpm:       row[COLS.bpm] || '',
        link:      row[COLS.link] || ''
      });
    }
  });

  return sections;
}

function sectionClass(name) {
  var s = name.toUpperCase();
  if (s.indexOf('GATHERING') >= 0 || s.indexOf('CALL TO WORSHIP') >= 0) return 'sc-gathering';
  if (s.indexOf('REVELATION') >= 0) return 'sc-revelation';
  if (s.indexOf('RESPONSE') >= 0 || s.indexOf('ENCOUNTER') >= 0 || s.indexOf('INTIMACY') >= 0) return 'sc-response';
  if (s.indexOf('VINEYARD') >= 0 || s.indexOf('HOMEGROWN') >= 0 || s.indexOf('GATEWAY') >= 0) return 'sc-homegrown';
  return '';
}

function themeBadge(themes) {
  if (!themes) return '';
  return '<span class="song-chip theme">' + esc(themes) + '</span>';
}

function bpmBadge(bpm) {
  if (!bpm) return '';
  return '<span class="song-chip key">' + esc(bpm) + ' BPM</span>';
}

function notesBadge(notes) {
  if (!notes) return '';
  var lower = notes.toLowerCase();
  var cls = lower.indexOf('classic') >= 0 ? 'song-chip key' :
            lower.indexOf('homegrown') >= 0 ? 'song-chip homegrown' :
            lower.indexOf('vineyard') >= 0 || lower.indexOf('kxc') >= 0 ? 'song-chip vineyard' :
            'song-chip';
  return '<span class="' + cls + '">' + esc(notes) + '</span>';
}

function renderSections(sections) {
  var el = document.getElementById('song-list');
  var total = sections.reduce(function(n, s) { return n + s.songs.length; }, 0);

  if (!total) {
    el.innerHTML = '<p style="color:var(--muted);font-size:13px;font-style:italic">No songs found.</p>';
    return;
  }

  var html = '';
  sections.forEach(function(s) {
    if (!s.songs.length) return;
    var sc = sectionClass(s.section);
    html += '<p class="rota-month-heading' + (sc ? ' ' + sc : '') + '">' + esc(s.section) + '</p>';
    s.songs.forEach(function(song) {
      var ccliLink = /^https?:\/\//.test(song.link) ? song.link
                   : /^\d+$/.test(song.ccli) ? 'https://songselect.ccli.com/Songs/' + song.ccli : '';
      var titleEl = ccliLink
        ? '<a class="song-title" href="' + esc(ccliLink) + '" target="_blank" rel="noopener">' + esc(song.title) + '</a>'
        : '<span class="song-title">' + esc(song.title) + '</span>';

      html += '<div class="song-row' + (sc ? ' ' + sc : '') + '">'
        + '<div class="song-main">'
        + titleEl
        + (song.firstLine ? '<span class="song-first-line">' + esc(song.firstLine) + '</span>' : '')
        + '</div>'
        + '<div class="song-meta">'
        + bpmBadge(song.bpm)
        + themeBadge(song.themes)
        + notesBadge(song.notes)
        + '</div>'
        + '</div>';
    });
  });

  el.innerHTML = html;
}

function filterSongs(query) {
  var q = query.toLowerCase().trim();
  if (!q) { renderSections(allSections); return; }

  var filtered = allSections.map(function(s) {
    return {
      section: s.section,
      songs: s.songs.filter(function(song) {
        return (song.title + ' ' + song.firstLine + ' ' + song.ccli + ' ' + song.themes + ' ' + song.notes + ' ' + song.bpm)
          .toLowerCase().indexOf(q) >= 0;
      })
    };
  });

  renderSections(filtered);
}

function esc(s) {
  return (s || '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

fetch(SHEET_URL)
  .then(function(r) { return r.text(); })
  .then(function(text) {
    var rows = parseCSV(text);
    allSections = buildSections(rows);
    renderSections(allSections);
  })
  .catch(function() {
    document.getElementById('song-list').innerHTML =
      '<p style="color:var(--muted);font-size:13px">Couldn\'t load the song list - please try again shortly.</p>';
  });
</script>
</body>
</html>
